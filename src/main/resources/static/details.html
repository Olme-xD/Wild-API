<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Animal Gallery</title>
	<link rel="icon" href="images/icon.jpg" type="image/jpg">
	<link href="css/bootstrap.min.css" rel="stylesheet">

	<style>
		body {
			background-image: url(images/bg.jpg);
			background-repeat: no-repeat;
			background-size: cover;
			background-attachment: fixed;
		}
	</style>
</head>

<body class="text-white">

	<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
		<div class="container">
			<a class="navbar-brand" href="index.html">
				<img class="img-fluid rounded" src="images/icon.jpg" alt="logo" style="height: 40px;">
			</a>
			<div class="navbar-nav">
				<a class="nav-link" href="index.html">Home</a>
				<a class="nav-link" href="new-animal-form.html">New Animal Form</a>
				<a class="nav-link" href="about.html">About</a>
			</div>
		</div>
	</nav>

	<div class="container mt-5 mb-4" id="main-content"></div>

	<script src="css/bootstrap.bundle.min.js"></script>
	<script>
		addEventListener("DOMContentLoaded", () => {
			const mainContent = document.getElementById('main-content');
			const urlParams = new URLSearchParams(window.location.search);
			const id = urlParams.get('id');
			fetch(`http://localhost:8080/api/wild/id?id=${id}`)
				.then(response => {
					if (!response.ok) {
						throw new Error(`Response was not ok: ${response.statusText}`);
					}
					return response.json();
				})
				.then(animal => {
					mainContent.innerHTML = `
						<div class="row justify-content-center">
							<div class="col-md-8">
								<div class="bg-light text-dark p-4 rounded">
									<h2 class="card-title mb-3">${animal.name}</h2>
									<img src="images/${animal.imageUrl}" class="img-fluid rounded mb-3" alt="An image of a Tiger">
									<p class="card-text">${animal.description}</p>
									<p class="card-title fw-bold">Habitat</p>
									<p class="card-text">${animal.habitat}</p>
									<p class="card-title fw-bold">Subspecies</p>
									<p class="card-text">${animal.subspecies}</p>
									<p class="card-title fw-bold">Author: ${animal.source}</p>
									<div class="mt-4 border-top pt-3">
    									<button id="edit-btn" class="btn btn-secondary">Edit Animal</button>
    									<button id="delete-btn" class="btn btn-danger">Delete Animal</button>
									</div>
								</div>
							</div>
						</div >
					`;
				})
				.catch(error => {
					alert('Failed to load animal details. Please try again.');
					console.error(error);
					window.location.href = 'index.html';
				});

				addEventListener('click', (event) => {
					if (event.target && event.target.id === 'edit-btn') {
						window.location.href = `edit-animal-form.html?id=${id}`;
					} else if (event.target && event.target.id === 'delete-btn') {
						if (confirm('Are you sure you want to delete this animal?')) {
							fetch(`http://localhost:8080/api/wild/delete?id=${id}`, {
								method: 'DELETE'
							})
							.then(response => {
								if (!response.ok) {
									throw new Error(`Response was not ok: ${response.statusText}`);
								}
								window.location.href = 'index.html';
							})
							.catch(error => {
								alert('Failed to delete animal. Please try again.');
								console.error(error);
							});
						}
					}
				});
		});
	</script>
</body>

</html>
